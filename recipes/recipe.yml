---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: maria-linux
description: María Linux

# Sistema base
base-image: ghcr.io/ublue-os/bazzite-gnome
image-version: latest

modules:
  # Archivos propios de María
  - type: files
    files:
      - source: system
        destination: /

  # Registrar los esquemas de configuración de GNOME
  - type: schema-compile
    source: local

  # Paquetes RPM
  - type: dnf
    repos:

      copr:
        - atim/starship
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      keys:
        - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc

    install:
      packages:
        - micro
        - starship
        - gnome-tweaks
        - liberation-fonts-all
        - gstreamer1-plugin-gtk4
        - repo: brave-browser
          packages:
            - brave-origin

    remove:
      packages:
        - firefox
        - firefox-langpacks

  # Aplicaciones Flatpak
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.vinegarhq.Sober
          - io.mrarm.mcpelauncher
          - net.lutris.Lutris
          - com.heroicgameslauncher.hgl
          - org.kde.dolphin
          - org.gnome.Loupe
          - io.github.tobagin.karere
          - io.github.seadve.Kooha
          - com.github.johnfactotum.Foliate

      - scope: user

  # Firma de la imagen
  - type: signing
